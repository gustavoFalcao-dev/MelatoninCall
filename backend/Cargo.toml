[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
bcrypt = "0.19.3"
chrono = "0.4.45"
dotenvy = "0.15.7"
serde = "1.0.229"
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "uuid", "chrono"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = "0.7.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.25.0", features = ["v4", "serde"] }
